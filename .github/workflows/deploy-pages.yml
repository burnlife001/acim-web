name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 触发规则：
  #   1. 网站代码任意变更（html/js/css/sw/manifest/icons/vendor）→ 部署
  #   2. src/ 下文件的新增/删除（含新增一本书）→ 部署
  #   3. 仅修改已有 md 内容（不改文件数）→ 不触发，靠手动 workflow_dispatch
  #   4. workflow_dispatch 手动触发始终部署
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect deploy-triggering changes
        id: check
        run: |
          # HEAD~1 可能不存在（根提交/历史重建/shallow），此时与空树比较——
          # 全部文件都算"新增"，必然触发部署
          if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            base=HEAD~1
          else
            base=$(git hash-object -t tree /dev/null)
          fi

          # 1) 网站代码任意变化 → 部署
          changed_code=$(git diff --name-only --diff-filter=ADM "$base" HEAD -- \
            'src/*.html' 'src/*.js' 'src/*.css' 'src/*.webmanifest' 'src/sw.js' \
            'src/icons/' 'src/vendor/' || true)
          echo "changed website code:"
          echo "$changed_code"

          # 2) src/ 下文件新增/删除（含新增一本书）→ 部署
          changed_struct=$(git diff --name-only --diff-filter=AD "$base" HEAD -- 'src/' || true)
          echo "added/deleted files under src/:"
          echo "$changed_struct"

          if [ -n "$changed_code" ] || [ -n "$changed_struct" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # src/ 是发布根。构建产物 (search.json / filelist.json) 由 gen-index 重写
      # 后随 src/ 一起上传,无需手动提交。gen-icons 幂等(图标已存在则跳过)。
      - name: Build
        run: bun scripts/build.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4